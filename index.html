<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>null</title>
<style>
:root { color-scheme: dark; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #777; font: 12px/1.5 ui-monospace, Consolas, monospace; }
#plane { position: fixed; inset: 0; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
#plane.held { cursor: grabbing; }
#plane div { position: absolute; left: 0; top: 0; background: #111 center / cover no-repeat; will-change: transform; }
#label { position: fixed; left: 8px; bottom: 8px; padding: 2px 8px; color: #888; background: rgba(0, 0, 0, 0.7); pointer-events: none; }
#view { position: fixed; inset: 0; background: #000; display: none; }
#view.on { display: block; }
#view img { width: 100%; height: 100%; object-fit: contain; }
#note { position: absolute; left: 12px; right: 12px; bottom: 10px; color: #999; text-shadow: 0 0 4px #000, 0 0 2px #000; pointer-events: none; }
#note .way { color: #777; user-select: all; pointer-events: auto; word-break: break-all; }
#note.off { display: none; }
#prev, #next { position: absolute; top: 0; bottom: 0; width: 25%; cursor: pointer; }
#prev { left: 0; } #next { right: 0; }
</style>
</head>
<body>
<div id="plane"></div>
<div id="label">22 shots. Drag to move, click to open. In a shot: arrows or the sides to step, i hides its command line, Esc closes.</div>
<div id="view"><img alt=""><div id="prev"></div><div id="next"></div><div id="note"><div class="caption"></div><div class="way"></div></div></div>
<script>
const shots = [{"name": "1794083268", "way": "--tp shot_1794083268 --time 150 --opt blink --opt still", "caption": ""}, {"name": "1794083946", "way": "--tp shot_1794083946 --time 229", "caption": ""}, {"name": "1794091370", "way": "--tp shot_1794091370 --time 150 --opt still", "caption": ""}, {"name": "1794091727", "way": "--tp shot_1794091727 --time 425 --opt chasm --opt rooms --opt orb", "caption": ""}, {"name": "1794091967", "way": "--tp shot_1794091967 --time 420 --opt chasm --opt rooms", "caption": ""}, {"name": "1794092034", "way": "--tp shot_1794092034 --time 440 --opt chasm --opt rooms", "caption": ""}, {"name": "1794092214", "way": "--tp shot_1794092214 --time 440 --opt chasm --opt rooms", "caption": ""}, {"name": "1794092429", "way": "--tp shot_1794092429 --time 440 --opt chasm --opt rooms", "caption": ""}, {"name": "1794093397", "way": "--tp shot_1794093397 --time 550 --opt chasm --opt rooms --opt fit --set kind=3", "caption": ""}, {"name": "1794093841", "way": "--tp shot_1794093841 --time 550 --opt chasm --opt rooms --opt fit --set kind=4", "caption": ""}, {"name": "1794094199", "way": "--tp shot_1794094199 --time 550 --opt chasm --opt rooms --opt fit --set kind=0", "caption": ""}, {"name": "1794095359", "way": "--tp shot_1794095359 --time 150 --opt canals_on --opt still", "caption": ""}, {"name": "1794096756", "way": "--tp shot_1794096756 --time 150 --opt canals_on --opt still", "caption": ""}, {"name": "1794097823", "way": "--tp shot_1794097823 --time 150 --opt canals_on --opt still", "caption": ""}, {"name": "1794099117", "way": "--tp shot_1794099117 --time 450 --opt canals_on --opt still", "caption": ""}, {"name": "1794102529", "way": "--tp shot_1794102529 --time 440 --opt chasm --opt still", "caption": ""}, {"name": "1794103358", "way": "--tp shot_1794103358 --time 440 --opt chasm --opt still", "caption": ""}, {"name": "1794103496", "way": "--tp shot_1794103496 --time 440 --opt chasm --opt still", "caption": ""}, {"name": "1794104335", "way": "--tp shot_1794104335 --time 420", "caption": ""}, {"name": "1794104602", "way": "--tp shot_1794104602 --time 388", "caption": ""}, {"name": "1794116527", "way": "--tp shot_1794116527 --time 151 --opt canals_on", "caption": ""}, {"name": "1794117640", "way": "--tp shot_1794117640 --time 151 --opt canals_on", "caption": ""}];
const n = shots.length;
const wrap = k => ((k % n) + n) % n;

// The plane: the shots in reading order, endless both ways (a row's end
// runs on into the next row's start, the last shot into the first). Only
// the tiles in view are drawn, as the plane moves under them.
const plane = document.getElementById("plane");
const GAP = 6;
let W, H, cols, rows, across, tiles = [];
let x = 0, y = 0, vx = 0, vy = 0;
function layout() {
  const tw = Math.min(540, innerWidth * 0.85);
  W = tw + GAP; H = tw * 9 / 16 + GAP;
  cols = Math.ceil(innerWidth / W) + 1; rows = Math.ceil(innerHeight / H) + 1;
  across = cols + 1;
  for (const t of tiles) t.remove();
  tiles = [];
  for (let k = 0; k < cols * rows; k++) {
    const t = document.createElement("div");
    t.style.width = tw + "px"; t.style.height = (tw * 9 / 16) + "px";
    plane.appendChild(t); tiles.push(t);
  }
  draw();
}
function at(i, j) { return wrap(j * across + i); }
function draw() {
  if (!n) return;
  const i0 = Math.floor(-x / W), j0 = Math.floor(-y / H);
  tiles.forEach((t, k) => {
    const i = i0 + (k % cols), j = j0 + Math.floor(k / cols);
    const s = at(i, j);
    if (t.dataset.s !== String(s)) { t.dataset.s = s; t.style.backgroundImage = "url(thumb/" + shots[s].name + ".jpg)"; }
    t.style.transform = "translate(" + (i * W + x) + "px," + (j * H + y) + "px)";
  });
}

// Dragged, and let go: it glides on, slowing (by half about every 0.2 s).
let held = null, moved = 0, running = false, last = 0;
function run() { if (!running) { running = true; last = performance.now(); requestAnimationFrame(step); } }
function step(now) {
  const dt = Math.min(now - last, 50); last = now;
  if (!held) {
    x += vx * dt; y += vy * dt;
    const k = Math.exp(-dt / 300);
    vx *= k; vy *= k;
    if (Math.hypot(vx, vy) < 0.01) { vx = vy = 0; }
  }
  draw();
  if (held || vx || vy) requestAnimationFrame(step); else running = false;
}
plane.addEventListener("pointerdown", e => {
  plane.setPointerCapture(e.pointerId);
  plane.classList.add("held");
  // (A click on a gliding plane stops it, not opens a shot.)
  moved = Math.hypot(vx, vy) > 0.1 ? 99 : 0;
  vx = vy = 0;
  held = { x: e.clientX, y: e.clientY, t: performance.now() };
  run();
});
plane.addEventListener("pointermove", e => {
  if (!held) return;
  const dx = e.clientX - held.x, dy = e.clientY - held.y, now = performance.now(), dt = Math.max(now - held.t, 1);
  x += dx; y += dy; moved += Math.hypot(dx, dy);
  // (Its speed, smoothed over the last few moves, px per ms.)
  vx = 0.7 * (dx / dt) + 0.3 * vx; vy = 0.7 * (dy / dt) + 0.3 * vy;
  held = { x: e.clientX, y: e.clientY, t: now };
});
function release(e) {
  if (!held) return;
  plane.classList.remove("held");
  // (Held still before letting go: no glide.)
  if (performance.now() - held.t > 80) vx = vy = 0;
  held = null;
  if (moved < 6 && e.type === "pointerup") {
    const t = document.elementFromPoint(e.clientX, e.clientY);
    if (t && t.dataset.s !== undefined) open(Number(t.dataset.s));
  }
  run();
}
plane.addEventListener("pointerup", release);
plane.addEventListener("pointercancel", release);
plane.addEventListener("wheel", e => { e.preventDefault(); x -= e.deltaX; y -= e.deltaY; draw(); }, { passive: false });
addEventListener("resize", layout);
layout();

// A shot, the whole screen.
const view = document.getElementById("view"), big = view.querySelector("img"), note = document.getElementById("note");
let shown = -1;
function show(i) {
  shown = wrap(i);
  const s = shots[shown];
  big.src = "img/" + s.name + ".jpg";
  note.querySelector(".caption").textContent = s.caption;
  note.querySelector(".way").textContent = "game.exe " + s.way;
  history.replaceState(null, "", "#" + s.name);
  for (const j of [shown - 1, shown + 1]) new Image().src = "img/" + shots[wrap(j)].name + ".jpg";
}
function open(i) {
  show(i);
  view.classList.add("on");
  if (view.requestFullscreen) view.requestFullscreen().catch(() => {});
}
function close() {
  if (shown < 0) return;
  view.classList.remove("on");
  shown = -1;
  history.replaceState(null, "", location.pathname);
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
}
document.getElementById("prev").addEventListener("click", () => show(shown - 1));
document.getElementById("next").addEventListener("click", () => show(shown + 1));
big.addEventListener("click", close);
document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement) close(); });
document.addEventListener("keydown", e => {
  if (shown < 0) return;
  if (e.key === "Escape") close();
  else if (e.key === "ArrowLeft") show(shown - 1);
  else if (e.key === "ArrowRight") show(shown + 1);
  else if (e.key === "i") note.classList.toggle("off");
});
const linked = shots.findIndex(s => "#" + s.name === location.hash);
if (linked >= 0) { show(linked); view.classList.add("on"); }
</script>
</body>
</html>
